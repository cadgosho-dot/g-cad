<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>g-CAD Login</title>
<style>
:root{--bg:#101216;--panel:#181b21;--line:#303640;--text:#eef2f7;--muted:#9ca8b7;--danger:#ff8b8b;--ok:#79e2aa}
*{box-sizing:border-box}html,body{min-height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 20%,#202735 0,#101216 55%);color:var(--text)}
body{display:grid;place-items:center;padding:24px}.card{width:min(420px,100%);background:#181b21;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 20px 80px #0008}
h1{font-size:24px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:24px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#c6cfdb;margin-bottom:6px}.field input{width:100%;background:#111419;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px 12px;outline:none}.field input:focus{border-color:#4f8fd0}
button{width:100%;border:1px solid #285f91;border-radius:8px;background:#173654;color:white;padding:11px 12px;font:inherit;cursor:pointer}button:hover{background:#1c4268}button:disabled{opacity:.55;cursor:wait}.linkbtn{margin-top:10px;background:transparent;border-color:transparent;color:#a9cfff;padding:7px}.msg{min-height:22px;margin-top:14px;font-size:12px;line-height:1.5}.error{color:var(--danger)}.ok{color:var(--ok)}.ver{text-align:center;color:#667383;font-size:11px;margin-top:18px}.setup{display:none;background:#2c2212;border:1px solid #745a20;border-radius:8px;padding:12px;color:#f4d17e;font-size:12px;line-height:1.6;margin-bottom:16px}
</style>
</head>
<body>
<main class="card">
  <h1>g-CAD</h1>
  <div class="sub">ジュエリー制作専用CADへログイン</div>
  <div id="setupNotice" class="setup">認証設定がまだ完了していません。<br>Supabase接続設定を確認してください。</div>
  <form id="loginForm">
    <div class="field"><label for="email">メールアドレス</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">パスワード</label><input id="password" type="password" autocomplete="current-password" required minlength="8"></div>
    <button id="loginBtn" type="submit">ログイン</button>
    <button id="signupBtn" class="linkbtn" type="button">初回アカウント登録</button>
    <button id="resetBtn" class="linkbtn" type="button">パスワードを忘れた場合</button>
    <div id="message" class="msg"></div>
  </form>
  <div class="ver">g-CAD Online v0.3</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>
<script src="js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
